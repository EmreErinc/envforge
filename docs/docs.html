<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="envforge-icon.svg">
  <title>EnvForge CLI Reference — Complete Command Documentation</title>
  <meta name="description" content="Complete CLI reference for EnvForge. 130+ commands covering variable management, AI safety, encryption hardening, secret providers (13), sync, schema validation, MCP integrity, and more. Credential encryption is mandatory by default.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* docs.html adopts the Terminal design system — legacy var names remapped onto tokens.css */
    :root {
      --bg:           var(--color-paper);
      --bg-secondary: var(--color-paper-2);
      --bg-tertiary:  var(--color-paper-3);
      --text:         var(--color-ink);
      --text-muted:   var(--color-muted);
      --accent:       var(--color-accent);
      --accent-green: var(--color-accent);
      --accent-yellow: var(--color-amber);
      --border:       var(--color-rule);
      /* --font-mono inherited from tokens.css (JetBrains Mono) */
      --font-sans:    "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    nav {
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .nav-logo {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }
    .nav-logo span { color: var(--accent-green); }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; }
    .nav-links a { color: var(--text-muted); font-size: 0.9rem; }
    .nav-links a:hover { color: var(--text); text-decoration: none; }
    .nav-links a.active { color: var(--accent); font-weight: 600; }

    .layout {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      min-width: 240px;
      border-right: 1px solid var(--border);
      padding: 1.5rem 1rem;
      position: sticky;
      top: 52px;
      height: calc(100vh - 52px);
      overflow-y: auto;
    }
    .sidebar h4 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin: 1.5rem 0 0.5rem;
    }
    .sidebar h4:first-child { margin-top: 0; }
    .sidebar a {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
    .sidebar a:hover { color: var(--text); background: var(--bg-secondary); text-decoration: none; }
    .sidebar a.active { color: var(--accent); background: var(--bg-secondary); }
    .sidebar .sub-items { display: none; padding-left: 0.5rem; }
    .sidebar .sub-items a { font-size: 0.75rem; padding: 0.15rem 0.5rem; opacity: 0.85; }
    .sidebar .section-toggle { cursor: pointer; user-select: none; position: relative; }
    .sidebar .section-toggle::after {
      content: '›';
      position: absolute;
      right: 0.3rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.7rem;
      transition: transform 0.15s;
    }
    .sidebar .section-toggle.open::after { transform: translateY(-50%) rotate(90deg); }
    .sidebar .section-toggle.open + .sub-items { display: block; }

    /* Search */
    .search-box {
      position: relative;
      margin-bottom: 1rem;
    }
    .search-box input {
      width: 100%;
      padding: 0.45rem 0.6rem 0.45rem 1.8rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.8rem;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box .search-icon {
      position: absolute;
      left: 0.55rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.75rem;
      pointer-events: none;
    }
    .search-box .search-kbd {
      position: absolute;
      right: 0.45rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.6rem;
      font-family: var(--font-mono);
      background: var(--bg-tertiary);
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      border: 1px solid var(--border);
      pointer-events: none;
    }
    .search-results {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 320px;
      overflow-y: auto;
      z-index: 20;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .search-results.active { display: block; }
    .search-result {
      padding: 0.5rem 0.7rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .search-result:last-child { border-bottom: none; }
    .search-result:hover, .search-result.selected { background: var(--bg-tertiary); }
    .search-result-title {
      font-size: 0.8rem;
      color: var(--accent);
      font-family: var(--font-mono);
    }
    .search-result-section {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 0.1rem;
    }
    .search-result-snippet {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-result mark {
      background: transparent;
      color: var(--accent-yellow);
      font-weight: 600;
    }
    .search-empty {
      padding: 0.75rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    .highlight-flash {
      animation: flash 1.5s ease-out;
    }
    @keyframes flash {
      0% { background: rgba(88,166,255,0.15); }
      100% { background: transparent; }
    }

    /* Content */
    .content {
      flex: 1;
      padding: 2rem 3rem;
      min-width: 0;
    }
    .content h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .content h1 + p { color: var(--text-muted); margin-bottom: 2rem; }
    .content h2 {
      font-size: 1.4rem;
      margin: 3rem 0 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .content h3 {
      font-size: 1.05rem;
      margin: 2rem 0 0.5rem;
      font-family: var(--font-mono);
      color: var(--accent);
    }
    .content h4 {
      font-size: 0.95rem;
      margin: 1.5rem 0 0.5rem;
      color: var(--text);
    }
    .content p { margin: 0.5rem 0; color: var(--text-muted); }
    .content strong { color: var(--text); }

    .content code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background: var(--bg-tertiary);
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
    }
    .content pre {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      margin: 0.75rem 0;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .content pre code {
      background: none;
      padding: 0;
    }

    .content table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75rem 0;
      font-size: 0.85rem;
    }
    .content th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 2px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    .content td {
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }
    .content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      color: var(--text-muted);
      margin: 1rem 0;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 2rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* mobile drawer toggle (hidden on desktop) */
    .menu-toggle {
      display: none;
      font-family: var(--font-mono); font-size: 1.1rem; line-height: 1;
      background: var(--bg-secondary); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 0.3rem 0.6rem; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .menu-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .sidebar-backdrop {
      display: none; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0.55);
    }

    @media (max-width: 768px) {
      .menu-toggle { display: inline-flex; align-items: center; }
      nav { flex-wrap: wrap; gap: 0.75rem; padding: 0.75rem 1.25rem; }
      nav .nav-logo { margin-right: auto; }
      .layout { display: block; }
      .sidebar {
        position: fixed; top: 0; left: 0; z-index: 40;
        width: min(82vw, 320px); height: 100dvh; min-width: 0;
        background: var(--bg); border-right: 1px solid var(--border);
        transform: translateX(-100%);
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .sidebar.open { transform: none; }
      .sidebar-backdrop.open { display: block; }
      .content { padding: 1.5rem; }
      .content h1 { font-size: 1.6rem; }
      .content h2 { font-size: 1.25rem; }
      .content pre { font-size: 0.8rem; }
      /* wide command tables scroll instead of overflowing the viewport */
      .content table { display: block; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sidebar { transition: none; }
    }
  </style>
</head>
<body>

  <nav>
    <button class="menu-toggle" id="menu-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">&#9776;</button>
    <a href="index.html" class="nav-logo"><img src="envforge-icon.svg" alt="EnvForge" width="24" height="24" style="vertical-align: middle; margin-right: 6px; border-radius: 4px;"> envforge</a>
    <div class="nav-links">
      <a href="docs.html" class="active">Docs</a>
      <a href="https://github.com/emreerinc/envforge">GitHub</a>
      <a href="crates.html">Crates.io</a>
    </div>
  </nav>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="layout">

    <aside class="sidebar" id="sidebar">
      <div class="search-box">
        <span class="search-icon">&#x1F50D;</span>
        <input type="text" id="search-input" placeholder="Search commands..." autocomplete="off" spellcheck="false">
        <span class="search-kbd" id="search-kbd">/</span>
        <div class="search-results" id="search-results"></div>
      </div>
      <div id="sidebar-nav"></div>
    </aside>

    <main class="content" id="docs-content">
      <h1>CLI Reference</h1>
      <p>Complete documentation for EnvForge v1.0.1 — 130+ commands.</p>

      <!-- Content will be loaded from markdown -->
      <noscript>
        <p>This page requires JavaScript to render the CLI reference from Markdown. <a href="cli-reference.md">View the raw Markdown file instead.</a></p>
      </noscript>
    </main>

  </div>

  <footer>
    <a href="index.html">Home</a> &middot;
    <a href="https://github.com/emreerinc/envforge">GitHub</a> &middot;
    <a href="cli-reference.md">Raw Markdown</a>
  </footer>

  <script>
    // Minimal Markdown-to-HTML renderer (no dependencies)
    function renderMarkdown(md) {
      // Step 1: Extract code blocks to placeholders (protect from paragraph wrapping)
      const codeBlocks = [];
      let html = md.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
        const idx = codeBlocks.length;
        codeBlocks.push(`<pre><code>${code.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n$/, '')}</code></pre>`);
        return `\x00CODEBLOCK${idx}\x00`;
      });

      html = html
        // Inline code
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // Tables
        .replace(/\|(.+)\|\n\|[-| ]+\|\n((?:\|.+\|\n)*)/g, (_, header, rows) => {
          const th = header.split('|').map(c => c.trim()).filter(c => c).map(c => `<th>${c}</th>`).join('');
          const tr = rows.trim().split('\n').map(row => {
            const td = row.split('|').map(c => c.trim()).filter(c => c).map(c => `<td>${c}</td>`).join('');
            return `<tr>${td}</tr>`;
          }).join('');
          return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
        })
        // Headings (process most-specific first)
        .replace(/^#### (.+)$/gm, (_, t) => {
          const id = t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
          return `<h4 id="${id}">${t}</h4>`;
        })
        .replace(/^### (.+)$/gm, (_, t) => {
          const id = t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
          return `<h3 id="${id}">${t}</h3>`;
        })
        .replace(/^## (.+)$/gm, (_, t) => {
          const id = t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
          return `<h2 id="${id}">${t}</h2>`;
        })
        .replace(/^# (.+)$/gm, '')
        // Blockquotes
        .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
        // Bold
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        // Links
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, url) => {
          if (url.startsWith('http')) return `<a href="${url}" target="_blank" rel="noopener">${text}</a>`;
          if (url.startsWith('#')) return `<a href="${url}">${text}</a>`;
          return `<a href="${url}">${text}</a>`;
        })
        // Horizontal rules
        .replace(/^---$/gm, '<hr>')
        // Paragraphs (non-empty lines not starting with < or | or placeholder)
        .replace(/^(?!<|$|\||\x00)(.+)$/gm, '<p>$1</p>')
        // Clean up empty paragraphs
        .replace(/<p><\/p>/g, '')
        // Fix double-wrapped tags
        .replace(/<p>(<h[234]|<pre|<table|<hr|<blockquote)/g, '$1')
        .replace(/(<\/h[234]>|<\/pre>|<\/table>|<hr>|<\/blockquote>)<\/p>/g, '$1');

      // Step 2: Restore code blocks
      html = html.replace(/\x00CODEBLOCK(\d+)\x00/g, (_, idx) => codeBlocks[parseInt(idx)]);

      return html;
    }

    function buildSidebar() {
      const content = document.getElementById('docs-content');
      const nav = document.getElementById('sidebar-nav');
      const headings = content.querySelectorAll('h2, h3');
      const fragment = document.createDocumentFragment();
      let currentH2Id = null;
      let h3Buffer = [];

      function flushH3s() {
        if (h3Buffer.length > 0) {
          const subItems = document.createElement('div');
          subItems.className = 'sub-items';
          h3Buffer.forEach(h => {
            const link = document.createElement('a');
            link.setAttribute('href', `#${h.id}`);
            link.textContent = h.text;
            subItems.appendChild(link);
          });
          fragment.appendChild(subItems);
          h3Buffer = [];
        }
      }

      headings.forEach(el => {
        if (el.tagName === 'H2') {
          flushH3s();
          currentH2Id = el.id;
          const sectionLink = document.createElement('a');
          sectionLink.setAttribute('href', `#${el.id}`);
          sectionLink.className = 'section-toggle';
          sectionLink.dataset.section = el.id;
          sectionLink.textContent = el.textContent;
          fragment.appendChild(sectionLink);
        } else if (el.tagName === 'H3' && currentH2Id) {
          h3Buffer.push({ id: el.id, text: el.textContent });
        }
      });
      flushH3s();
      nav.replaceChildren(fragment);

      // Toggle sub-items on section click
      nav.querySelectorAll('.section-toggle').forEach(a => {
        a.addEventListener('click', function(e) {
          e.preventDefault();
          this.classList.toggle('open');
          const target = document.getElementById(this.getAttribute('href').slice(1));
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });

      // Highlight active section on scroll
      let ticking = false;
      window.addEventListener('scroll', () => {
        if (!ticking) {
          requestAnimationFrame(() => {
            const scrollY = window.scrollY + 80;
            let activeH2 = null;
            let activeH3 = null;
            content.querySelectorAll('h2, h3').forEach(el => {
              if (el.offsetTop <= scrollY) {
                if (el.tagName === 'H2') { activeH2 = el.id; activeH3 = null; }
                else activeH3 = el.id;
              }
            });
            nav.querySelectorAll('a').forEach(a => a.classList.remove('active'));
            nav.querySelectorAll('.section-toggle').forEach(a => a.classList.remove('open'));
            if (activeH2) {
              const sectionLink = nav.querySelector(`[data-section="${activeH2}"]`);
              if (sectionLink) {
                sectionLink.classList.add('active', 'open');
              }
            }
            if (activeH3) {
              const h3Link = nav.querySelector(`[href="#${activeH3}"]`);
              if (h3Link) h3Link.classList.add('active');
            }
            ticking = false;
          });
          ticking = true;
        }
      });
    }

    // Multi-doc viewer — pick any public reference doc to render in place.
    const DOCS = [
      { id: 'cli-reference', file: 'cli-reference.md', title: 'CLI Reference', desc: 'Complete documentation for EnvForge v1.0.1 — 130+ commands.' },
      { id: 'api-reference', file: 'api-reference.md', title: 'API Reference', desc: 'Public Rust API for library consumers.' },
      { id: 'integration-matrix', file: 'integration-matrix.md', title: 'Integration Matrix', desc: 'AI tools × editors × capabilities.' },
      { id: 'mcp-server', file: 'mcp-server.md', title: 'MCP Server', desc: 'Read-safe MCP server + client config.' },
      { id: 'ci-gating', file: 'ci-gating.md', title: 'CI Gating', desc: 'Gate CI on fence coverage + credential scan.' },
      { id: 'lsp-clients', file: 'lsp-clients.md', title: 'Editor / LSP Setup', desc: 'First-party + LSP-only editor setup.' },
      { id: 'ide-behavior-contract', file: 'ide-behavior-contract.md', title: 'IDE Behavior Contract', desc: 'Per-feature plugin parity spec.' },
      { id: 'scanner-recipes', file: 'scanner-recipes.md', title: 'Scanner Recipes', desc: 'Secret-scanning recipes.' },
    ];

    function buildDocPicker(activeId) {
      let picker = document.getElementById('doc-picker');
      if (!picker) {
        picker = document.createElement('div');
        picker.id = 'doc-picker';
        picker.style.cssText = 'display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:1rem;';
        const sb = document.getElementById('sidebar');
        sb.insertBefore(picker, sb.firstChild);
      }
      picker.innerHTML = DOCS.map(d =>
        '<a href="?doc=' + d.id + '" data-doc="' + d.id + '" style="font-family:var(--font-mono);font-size:var(--text-sm);padding:.2rem .5rem;border-radius:6px;text-decoration:none;border:1px solid var(--color-border,#333);' +
        (d.id === activeId ? 'background:var(--color-accent-dim,#2a2a2a);font-weight:600;' : '') + '">' + d.title + '</a>'
      ).join('');
      picker.querySelectorAll('a').forEach(a => a.addEventListener('click', function (e) {
        e.preventDefault();
        const d = DOCS.find(x => x.id === a.dataset.doc);
        if (d) loadDoc(d);
      }));
    }

    function loadDoc(d) {
      history.replaceState(null, '', '?doc=' + d.id);
      const raw = document.querySelector('footer a[href$=".md"]');
      if (raw) raw.setAttribute('href', d.file);
      buildDocPicker(d.id);
      fetch(d.file)
        .then(r => r.text())
        .then(md => {
          document.getElementById('docs-content').innerHTML =
            '<h1>' + d.title + '</h1><p>' + d.desc + '</p>' + renderMarkdown(md);
          buildSidebar();
          buildSearchIndex();
          window.scrollTo(0, 0);
        })
        .catch(() => {
          document.getElementById('docs-content').innerHTML =
            '<h1>' + d.title + '</h1><p>Could not load documentation. <a href="' + d.file + '">View raw Markdown.</a></p>';
        });
    }

    (function initDocs() {
      const want = new URLSearchParams(location.search).get('doc');
      const d = DOCS.find(x => x.id === want) || DOCS[0];
      loadDoc(d);
    })();

    // Search
    let searchIndex = [];
    let selectedIdx = -1;

    function buildSearchIndex() {
      searchIndex = [];
      const content = document.getElementById('docs-content');
      let currentSection = '';
      const els = content.querySelectorAll('h2, h3, p, td, pre');
      els.forEach(el => {
        if (el.tagName === 'H2') {
          currentSection = el.textContent;
          searchIndex.push({ type: 'section', title: el.textContent, id: el.id, section: '', text: el.textContent, el });
        } else if (el.tagName === 'H3') {
          searchIndex.push({ type: 'command', title: el.textContent, id: el.id, section: currentSection, text: el.textContent, el });
        } else {
          const text = el.textContent.trim();
          if (!text) return;
          // attach context to nearest h3 or h2 above
          let heading = el.previousElementSibling;
          let anchor = el;
          while (heading && heading.tagName !== 'H3' && heading.tagName !== 'H2') {
            heading = heading.previousElementSibling;
          }
          if (heading) anchor = heading;
          searchIndex.push({ type: 'content', title: heading ? heading.textContent : currentSection, id: anchor.id || '', section: currentSection, text, el: anchor });
        }
      });
    }

    function fuzzyMatch(query, text) {
      const lower = text.toLowerCase();
      const q = query.toLowerCase();
      // exact substring
      const idx = lower.indexOf(q);
      if (idx !== -1) return { score: 100 - idx, start: idx };
      // word-start match
      const words = q.split(/\s+/);
      if (words.every(w => lower.includes(w))) return { score: 50, start: lower.indexOf(words[0]) };
      return null;
    }

    function highlightText(text, query) {
      const q = query.toLowerCase();
      const i = text.toLowerCase().indexOf(q);
      if (i === -1) {
        // try each word
        let result = text;
        query.split(/\s+/).forEach(w => {
          const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
          result = result.replace(re, '<mark>$1</mark>');
        });
        return result;
      }
      return text.slice(0, i) + '<mark>' + text.slice(i, i + query.length) + '</mark>' + text.slice(i + query.length);
    }

    function doSearch(query) {
      const results = document.getElementById('search-results');
      if (!query || query.length < 2) {
        results.classList.remove('active');
        selectedIdx = -1;
        return;
      }

      const seen = new Set();
      const matches = [];
      searchIndex.forEach(entry => {
        const m = fuzzyMatch(query, entry.text);
        if (!m) return;
        const key = entry.id || entry.title;
        if (seen.has(key)) return;
        seen.add(key);
        // boost commands and sections
        let score = m.score;
        if (entry.type === 'command') score += 30;
        if (entry.type === 'section') score += 20;
        matches.push({ ...entry, score, matchStart: m.start });
      });

      matches.sort((a, b) => b.score - a.score);
      const top = matches.slice(0, 12);

      if (top.length === 0) {
        results.innerHTML = '<div class="search-empty">No results for &ldquo;' + query.replace(/</g,'&lt;') + '&rdquo;</div>';
        results.classList.add('active');
        selectedIdx = -1;
        return;
      }

      results.innerHTML = top.map((m, i) => {
        const snippet = m.type === 'content' ? m.text.slice(0, 80) : '';
        return '<div class="search-result" data-idx="' + i + '">' +
          '<div class="search-result-title">' + highlightText(m.title, query) + '</div>' +
          (m.section && m.type !== 'section' ? '<div class="search-result-section">' + m.section + '</div>' : '') +
          (snippet ? '<div class="search-result-snippet">' + highlightText(snippet, query) + '</div>' : '') +
          '</div>';
      }).join('');

      results.classList.add('active');
      selectedIdx = -1;

      results.querySelectorAll('.search-result').forEach((el, i) => {
        el.addEventListener('click', () => navigateTo(top[i]));
        el.addEventListener('mouseenter', () => {
          selectedIdx = i;
          updateSelected();
        });
      });

      // store for keyboard nav
      results._matches = top;
    }

    function navigateTo(match) {
      const results = document.getElementById('search-results');
      const input = document.getElementById('search-input');
      results.classList.remove('active');
      input.blur();
      if (match.el) {
        match.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        match.el.classList.add('highlight-flash');
        setTimeout(() => match.el.classList.remove('highlight-flash'), 1500);
      } else if (match.id) {
        const target = document.getElementById(match.id);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function updateSelected() {
      const results = document.getElementById('search-results');
      results.querySelectorAll('.search-result').forEach((el, i) => {
        el.classList.toggle('selected', i === selectedIdx);
      });
    }

    // Event listeners
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const searchKbd = document.getElementById('search-kbd');

    searchInput.addEventListener('input', () => doSearch(searchInput.value.trim()));

    searchInput.addEventListener('keydown', e => {
      const matches = searchResults._matches || [];
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectedIdx = Math.min(selectedIdx + 1, matches.length - 1);
        updateSelected();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedIdx = Math.max(selectedIdx - 1, 0);
        updateSelected();
      } else if (e.key === 'Enter' && selectedIdx >= 0 && matches[selectedIdx]) {
        e.preventDefault();
        navigateTo(matches[selectedIdx]);
      } else if (e.key === 'Escape') {
        searchResults.classList.remove('active');
        searchInput.blur();
      }
    });

    searchInput.addEventListener('focus', () => {
      searchKbd.style.display = 'none';
      if (searchInput.value.trim().length >= 2) doSearch(searchInput.value.trim());
    });

    searchInput.addEventListener('blur', () => {
      setTimeout(() => searchResults.classList.remove('active'), 150);
      if (!searchInput.value) searchKbd.style.display = '';
    });

    // Keyboard shortcut: / to focus search
    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== searchInput && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
    });
  </script>

  <script>
    // mobile sidebar drawer
    (function () {
      var toggle = document.getElementById('menu-toggle');
      var sidebar = document.getElementById('sidebar');
      var backdrop = document.getElementById('sidebar-backdrop');
      if (!toggle || !sidebar || !backdrop) return;

      function open() {
        sidebar.classList.add('open');
        backdrop.classList.add('open');
        toggle.setAttribute('aria-expanded', 'true');
      }
      function close() {
        sidebar.classList.remove('open');
        backdrop.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      }

      toggle.addEventListener('click', function () {
        sidebar.classList.contains('open') ? close() : open();
      });
      backdrop.addEventListener('click', close);
      // close when a real nav link is tapped (not a section expander)
      sidebar.addEventListener('click', function (e) {
        var a = e.target.closest('a');
        if (a && !a.classList.contains('section-toggle')) close();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && sidebar.classList.contains('open')) close();
      });
    })();
  </script>

</body>
</html>
