<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Outer dark rounded background -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#0A0A0A"/>

  <!-- Terminal window -->
  <rect x="28" y="32" width="200" height="192" rx="16" fill="#131313" stroke="#2A2A2A" stroke-width="1.5"/>

  <!-- Title bar separator -->
  <line x1="28" y1="66" x2="228" y2="66" stroke="#2A2A2A" stroke-width="1.5"/>

  <!-- macOS dots -->
  <circle cx="52" cy="49" r="6" fill="#FF5F57"/>
  <circle cx="72" cy="49" r="6" fill="#FEBC2E"/>
  <circle cx="92" cy="49" r="6" fill="#28C840"/>

  <!-- Shield with keyhole (below text, safely inside terminal) -->
  <g transform="translate(128 172)" stroke="#1E4D3A" stroke-width="2.5" fill="none" stroke-linejoin="round">
    <path d="M0 -32 L28 -25 L28 4 Q28 22 0 33 Q-28 22 -28 4 L-28 -25 Z"/>
    <circle cx="0" cy="2" r="4.5"/>
    <line x1="0" y1="6.5" x2="0" y2="17" stroke-linecap="round"/>
  </g>

  <!-- >_ENV text -->
  <text x="128" y="115" text-anchor="middle"
        font-family="'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace"
        font-size="40" font-weight="700" fill="#3DDC84" letter-spacing="1">&gt;_ENV</text>
</svg>
