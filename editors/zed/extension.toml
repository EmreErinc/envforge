id = "envforge"
name = "EnvForge"
version = "0.2.0"
schema_version = 1
authors = ["EnvForge"]
description = "AI-safe environment & secrets: EnvForge LSP diagnostics + read-safe MCP server."
repository = "https://github.com/envforge/envforge"

# EnvForge speaks LSP — Zed gets schema completion, hover provenance,
# diagnostics, MCP-config credential warnings, and the envforge/* requests.
# (Native status-bar/gutter UI is not possible via Zed's extension API yet —
# Draft RFC #53403 — so this is LSP + MCP only, per Architecture D8.)
[language_servers.envforge]
name = "EnvForge"
languages = ["Dotenv"]

# Read-safe MCP server (`envforge mcp serve`): exposes env-var key names +
# schema metadata to Zed's AI assistant through a guarded, audited channel —
# never raw secret values (Epic 2).
[context_servers.envforge-mcp]
