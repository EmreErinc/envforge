# Smithery.ai Configuration Manifest for EnvForge MCP Server
startCommand:
  type: stdio
  command: envforge
  args:
    - mcp
    - serve
  env: {}

metadata:
  name: envforge
  description: The AI-safe environment variable manager MCP server. Gives AI agents environment metadata without exposing raw secret values.
  version: 0.8.4
  license: Elastic-2.0
  homepage: https://github.com/emreerinc/envforge
