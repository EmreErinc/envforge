# cargo-deny configuration

[advisories]
version = 2
unmaintained = "none"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "MPL-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib"
]
confidence-threshold = 0.92

[bans]
multiple-versions = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
unused-allowed-source = "warn"