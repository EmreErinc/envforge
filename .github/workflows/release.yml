name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }} ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        variant:
          - default
          - sigstore
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}

      - name: Compute feature flags
        id: features
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = "sigstore" ]; then
            echo "flags=--features sigstore" >> "$GITHUB_OUTPUT"
            echo "suffix=-sigstore" >> "$GITHUB_OUTPUT"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} ${{ steps.features.outputs.flags }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          ARCHIVE_NAME="envforge-${{ matrix.target }}${{ steps.features.outputs.suffix }}.${{ matrix.archive }}"
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar czf "../../../${ARCHIVE_NAME}" envforge
          fi
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: envforge-${{ matrix.target }}${{ steps.features.outputs.suffix }}
          path: envforge-${{ matrix.target }}${{ steps.features.outputs.suffix }}.${{ matrix.archive }}

  # ---------------------------------------------------------------------------
  # Build VSCode extension
  # ---------------------------------------------------------------------------
  build-vscode:
    name: VSCode Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Build and package
        working-directory: editors/vscode
        run: |
          npm run bundle
          npx vsce package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-plugin
          path: editors/vscode/*.vsix

  # ---------------------------------------------------------------------------
  # Build IntelliJ plugin
  # ---------------------------------------------------------------------------
  build-intellij:
    name: IntelliJ Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin
        working-directory: editors/intellij
        run: ./gradlew buildPlugin

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin
          path: editors/intellij/build/distributions/*.zip

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all artifacts
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [build, build-vscode, build-intellij]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release ${GITHUB_REF_NAME}"
          fi
          echo "$BODY" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: false
          make_latest: true
          files: artifacts/**/*
